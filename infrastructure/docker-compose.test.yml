# =============================================================================
# Cost Watchdog - Integration Test Infrastructure
# =============================================================================
# This compose file is for LOCAL TESTS only.
# It uses separate ports to avoid clashing with dev compose.
# =============================================================================

name: cost-watchdog-test

services:
  postgres:
    image: postgres:16-alpine
    container_name: cost-watchdog-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: cost_watchdog_test
      POSTGRES_PASSWORD: cost_watchdog_test
      POSTGRES_DB: cost_watchdog_test
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cost_watchdog_test -d cost_watchdog_test']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cost-watchdog-redis-test
    restart: unless-stopped
    # Keep config simple for tests; avoid eviction to protect BullMQ semantics.
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction --appendonly no
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_test_data:
  redis_test_data:
